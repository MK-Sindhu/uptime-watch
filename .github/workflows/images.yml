# Builds the five images. Called by ci.yml on pull requests (build and scan,
# no push) and by cd.yml on main (build and push to Artifact Registry).
#
# Pushed images are tagged with the commit SHA, never `latest`, so the deploy
# repo always names an exact build.
name: Images

on:
  workflow_call:
    inputs:
      push:
        description: Push to Artifact Registry (needs id-token write from the caller)
        type: boolean
        required: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
            target: service
            build-args: APP=api
          - image: worker
            file: Dockerfile
            target: service
            build-args: APP=worker
          - image: pusher
            file: Dockerfile
            target: service
            build-args: APP=pusher
          - image: migrate
            file: Dockerfile
            target: migrate
            build-args: |
              APP=store
              APP_DIR=packages/store
          - image: fe
            file: apps/fe/Dockerfile
            target: ""
            build-args: ""
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub's OIDC token is exchanged for a short-lived Google token
      # (Workload Identity Federation): no service-account key is stored.
      - name: Sign in to Google Cloud
        if: inputs.push
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Sign in to Artifact Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ inputs.push && format('{0}/{1}:{2}', env.REGISTRY, matrix.image, github.sha) || format('uptime-watch/{0}:ci', matrix.image) }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layers are cached per image. Pull requests read main's cache but
          # don't write their own.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ inputs.push && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

      # Report only: a new CVE in a base image shouldn't block every pull
      # request. Set exit-code to "1" to make HIGH/CRITICAL findings fail.
      - name: Scan for known vulnerabilities
        if: ${{ !inputs.push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uptime-watch/${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
